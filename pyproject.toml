[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-marketdata"
version = "0.5.0"
description = "Market-data & execution-simulation primitives for crypto perp/spot carry: funding-rate loaders (Binance/Hyperliquid) + cross-venue differential, observed order books (ccxt), book-walking paper fills, square-root market impact + breakeven-in-size, and funding-carry cost attribution. numpy/pandas."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Robin Denis" }]
keywords = [
    "market-impact",
    "slippage",
    "order-book",
    "paper-trading",
    "execution",
    "funding-carry",
    "crypto",
    "quant",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
live = ["ccxt>=4.2"]
store = ["pyarrow>=14"]
stream = ["pyarrow>=14", "websockets>=12"]
dev = ["pytest>=7", "ruff>=0.4", "pyarrow>=14", "websockets>=12"]

[project.scripts]
qmd-download = "quant_marketdata.venues.download:main"
qmd-record = "quant_marketdata.venues.stream.cli:main"
qmd-snapshot = "quant_marketdata.venues.snapshot:main"
qmd-options-daily = "quant_marketdata.venues.snapshot:daily_main"
qmd-binance-vision = "quant_marketdata.venues.binance_vision:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits public venue APIs (deselected by default; run with -m live)"]
addopts = "-m 'not live'"
